name: ci
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, closed]

jobs:
    test:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
            - uses: bahmutov/npm-install@v1
            - run: npm run build-keycloak-theme

    check_if_version_upgraded:
        name: Check if version upgrade
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: test
        outputs:
            from_version: ${{ steps.step1.outputs.from_version }}
            to_version: ${{ steps.step1.outputs.to_version }}
            is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
            is_pre_release: ${{steps.step1.outputs.is_pre_release }}
        steps:
            - uses: garronej/ts-ci@v2.1.5
              id: step1
              with:
                  action_name: is_package_json_version_upgraded
                  branch: ${{ github.head_ref || github.ref }}

    create_github_release:
        runs-on: ubuntu-latest
        needs: check_if_version_upgraded
        if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
            - uses: bahmutov/npm-install@v1
            - run: npm run build-keycloak-theme
            - uses: softprops/action-gh-release@v2
              with:
                  name: Release v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  tag_name: v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  target_commitish: ${{ github.head_ref || github.ref }}
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ needs.check_if_version_upgraded.outputs.is_pre_release == 'true' }}
                  files: dist_keycloak/keycloak-theme-*.jar
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    create_pr_release:
        name: Create PR pre-release
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: write
        env:
            TAG: pr-${{ github.event.pull_request.number }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
            - uses: bahmutov/npm-install@v1
            - run: npm run build-keycloak-theme
            # Replace the previous release so the tag points at the latest PR commit
            - run: gh release delete "$TAG" --cleanup-tag --yes || true
            - uses: softprops/action-gh-release@v2
              with:
                  name: PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})
                  tag_name: ${{ env.TAG }}
                  target_commitish: ${{ github.event.pull_request.head.sha }}
                  body: |
                      Pre-release build of #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}.
                      This release is removed when the PR is closed.
                  prerelease: true
                  make_latest: false
                  files: dist_keycloak/keycloak-theme-*.jar

    delete_pr_release:
        name: Delete PR pre-release
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: write
        steps:
            - run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes --repo "${{ github.repository }}" || true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
